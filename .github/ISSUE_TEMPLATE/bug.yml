name: Bug Report
description: Report a bug.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `noz --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS / tmux / git versions
    validations:
      required: true
