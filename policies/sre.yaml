name: sre
description: SRE policy — read-only infra, pauses on any mutation

rules:
  # --- Bash tool rules ---

  - name: kubectl-readonly
    cel: |
      request.cmd == "kubectl" &&
        request.args.exists(a, a == "get" || a == "describe" || a == "logs" || a == "top" || a == "explain" || a == "auth")
    verdict: ALLOW

  - name: kubectl-mutations-pause
    cel: request.cmd == "kubectl"
    verdict: PAUSE

  - name: gcx-all
    cel: request.cmd == "gcx"
    verdict: ALLOW

  - name: gh-readonly
    cel: |
      request.cmd == "gh" &&
        request.args.all(a, !(a == "create" || a == "merge" || a == "close" || a == "delete" || a == "edit"))
    verdict: ALLOW

  - name: git-readonly
    cel: |
      request.cmd == "git" &&
        request.args.exists(a, a == "log" || a == "status" || a == "diff" || a == "show" || a == "branch" || a == "remote")
    verdict: ALLOW

  - name: git-write-pause
    cel: request.cmd == "git"
    verdict: PAUSE

  - name: safe-read-tools
    cel: |
      request.cmd in ["cat", "ls", "find", "grep", "rg", "jq", "yq", "head", "tail", "wc", "diff", "file", "stat", "tree", "less", "sort", "uniq", "cut", "pwd", "which", "env", "echo", "date"]
    verdict: ALLOW

  - name: network-diag
    cel: |
      request.cmd in ["curl", "dig", "nslookup", "ping", "traceroute", "ss", "netstat"]
    verdict: ALLOW

  # --- File access rules ---

  - name: block-sensitive-files
    cel: |
      request.tool in ["read", "write", "edit"] &&
        request.path.matches(".*\\.(env|pem|key|p12|pfx|secret|credentials)$")
    verdict: DENY

  - name: block-sensitive-dirs
    cel: |
      request.tool in ["read", "write", "edit"] &&
        (request.path.contains("/.ssh/") ||
         request.path.contains("/.aws/") ||
         request.path.contains("/.config/gcloud/") ||
         request.path.contains("/.config/gcx/") ||
         request.path.contains("/.kube/config") ||
         request.path.contains("/.gnupg/"))
    verdict: DENY

  - name: block-writes
    cel: |
      request.tool in ["write", "edit"]
    verdict: DENY

  - name: allow-reads
    cel: |
      request.tool == "read"
    verdict: ALLOW

  # --- Default ---

  - name: default-deny
    verdict: DENY
